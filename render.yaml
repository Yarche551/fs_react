# Render Blueprint: backend (Node) + frontend (статика) в одном репозитории.
# Импорт: Render Dashboard → New → Blueprint → выбрать этот репозиторий (ветка master).
#
# Имена сервисов подобраны свободными, поэтому адреса предсказуемы:
#   API   → https://fs-react-api.onrender.com
#   Сайт  → https://fs-react-web.onrender.com
# Они же прописаны ниже в CORS_ORIGIN и VITE_API_HOST — вручную вводить нужно только DB_URL.
services:
  # ---------- API ----------
  - type: web
    name: fs-react-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Строка подключения к MongoDB Atlas — вводится в дашборде при деплое
      - key: DB_URL
        sync: false
      - key: DB_NAME
        value: freelancers
      # Секрет для JWT генерируется Render-ом один раз
      - key: SECRET
        generateValue: true
      # Домен статики: с него разрешены запросы к API
      - key: CORS_ORIGIN
        value: https://fs-react-web.onrender.com

  # ---------- Frontend (Vite build → статика) ----------
  - type: web
    name: fs-react-web
    runtime: static
    rootDir: frontend
    # --ignore-scripts обязателен: admin-lte тянет summernote с husky-скриптом,
    # который падает на CI (husky: command not found)
    buildCommand: npm ci --ignore-scripts && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Адрес API вшивается в бандл на этапе сборки
      - key: VITE_API_HOST
        value: https://fs-react-api.onrender.com
    routes:
      # SPA: любой путь отдаёт index.html, иначе прямой заход на /orders вернёт 404
      - type: rewrite
        source: /*
        destination: /index.html
